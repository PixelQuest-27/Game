<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Drift</title>
  <style>
    :root {
      --bg1: #070b17;
      --bg2: #101a2f;
      --panel: #0b1326;
      --text: #e8f1ff;
      --accent: #6ee7ff;
      --danger: #ff5f7a;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1) 58%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(92vw, 760px);
      background: rgba(11, 19, 38, 0.8);
      border: 2px solid rgba(110, 231, 255, 0.3);
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(110, 231, 255, 0.15);
      padding: 18px 18px 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      color: var(--text);
      font-size: 14px;
      text-transform: uppercase;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(to bottom, #0a1327, #0e1a2f 60%, #0c1624);
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c3d5f4;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <canvas id="game" width="720" height="480"></canvas>
    <div class="footer">Move: A/D or ←/→ • Restart: Space</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const state = {
      score: 0,
      best: Number(localStorage.getItem('star-drift-best') || 0),
      running: true,
      lastTime: 0,
      spawnTimer: 0,
      stars: [],
      bullets: [],
      rocks: [],
      particles: [],
      player: {
        x: canvas.width / 2,
        y: canvas.height - 44,
        r: 18,
        speed: 360,
        cooldown: 0
      }
    };

    const keys = {
      left: false,
      right: false
    };

    function resetGame() {
      state.score = 0;
      state.spawnTimer = 0;
      state.rocks = [];
      state.bullets = [];
      state.particles = [];
      state.player.x = canvas.width / 2;
      state.player.y = canvas.height - 44;
      state.player.cooldown = 0;
      state.running = true;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(state.score);
      bestEl.textContent = Math.floor(state.best);
    }

    function createStars() {
      state.stars = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 30 + 20
      }));
    }

    function spawnRock() {
      const size = Math.random() * 16 + 14;
      state.rocks.push({
        x: Math.random() * (canvas.width - size * 2) + size,
        y: -size,
        r: size,
        speed: Math.random() * 110 + 135 + state.score * 0.35,
        spin: (Math.random() - 0.5) * 2.2
      });
    }

    function shoot() {
      state.bullets.push({
        x: state.player.x,
        y: state.player.y - 18,
        r: 4,
        speed: 480
      });
    }

    function explode(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        state.particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 220,
          vy: (Math.random() - 0.5) * 220,
          life: 0.8 + Math.random() * 0.7,
          color,
          r: Math.random() * 3 + 2
        });
      }
    }

    function handleInput(dt) {
      if (keys.left) state.player.x -= state.player.speed * dt;
      if (keys.right) state.player.x += state.player.speed * dt;

      state.player.x = Math.max(24, Math.min(canvas.width - 24, state.player.x));
      state.player.cooldown = Math.max(0, state.player.cooldown - dt);

      if (keys.fire && state.player.cooldown <= 0) {
        shoot();
        state.player.cooldown = 0.18;
      }
    }

    function update(dt) {
      if (!state.running) return;

      state.score += dt * 10;

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnRock();
        state.spawnTimer = Math.max(0.45, 1.1 - state.score * 0.004);
      }

      for (const star of state.stars) {
        star.y += star.speed * dt;
        if (star.y > canvas.height) {
          star.y = -6;
          star.x = Math.random() * canvas.width;
        }
      }

      handleInput(dt);

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        bullet.y -= bullet.speed * dt;

        if (bullet.y < -10) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let j = state.rocks.length - 1; j >= 0; j--) {
          const rock = state.rocks[j];
          const dx = bullet.x - rock.x;
          const dy = bullet.y - rock.y;
          if (Math.hypot(dx, dy) < bullet.r + rock.r) {
            explode(rock.x, rock.y, '#ffd166', 16);
            state.rocks.splice(j, 1);
            state.bullets.splice(i, 1);
            state.score += 12;
            break;
          }
        }
      }

      for (let i = state.rocks.length - 1; i >= 0; i--) {
        const rock = state.rocks[i];
        rock.y += rock.speed * dt;
        rock.x += Math.sin((rock.y + i) * 0.06) * 24 * dt;
        rock.spin += 0.04;

        const playerDist = Math.hypot(state.player.x - rock.x, state.player.y - rock.y);
        if (playerDist < state.player.r + rock.r) {
          state.running = false;
          state.best = Math.max(state.best, state.score);
          localStorage.setItem('star-drift-best', String(Math.floor(state.best)));
          updateHud();
          explode(state.player.x, state.player.y, '#ff5f7a', 30);
          break;
        }

        if (rock.y - rock.r > canvas.height + 20) {
          state.rocks.splice(i, 1);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      updateHud();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of state.stars) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(state.player.x, state.player.y);

      ctx.fillStyle = '#6ee7ff';
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(14, 18);
      ctx.lineTo(0, 12);
      ctx.lineTo(-14, 18);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#dff7ff';
      ctx.fillRect(-4, 8, 8, 12);
      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of state.bullets) {
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRocks() {
      for (const rock of state.rocks) {
        ctx.save();
        ctx.translate(rock.x, rock.y);
        ctx.rotate(rock.spin);

        ctx.fillStyle = '#b7c3d9';
        ctx.beginPath();
        for (let i = 0; i < 7; i++) {
          const ang = (i / 7) * Math.PI * 2;
          const radius = rock.r * (0.7 + ((i % 2) * 0.4));
          const x = Math.cos(ang) * radius;
          const y = Math.sin(ang) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawGameOver() {
      if (state.running) return;

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Arial';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 18);

      ctx.font = '20px Arial';
      ctx.fillStyle = '#dfe8ff';
      ctx.fillText(`Score: ${Math.floor(state.score)}`, canvas.width / 2, canvas.height / 2 + 24);

      ctx.font = '16px Arial';
      ctx.fillStyle = '#6ee7ff';
      ctx.fillText('Press Space to play again', canvas.width / 2, canvas.height / 2 + 62);
    }

    function loop(ts) {
      const dt = Math.min((ts - state.lastTime) / 1000 || 0.016, 0.032);
      state.lastTime = ts;

      update(dt);

      drawBackground();
      drawBullets();
      drawRocks();
      drawParticles();
      drawPlayer();
      drawGameOver();

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;

      if (e.key === ' ' || e.code === 'Space') {
        if (!state.running) {
          resetGame();
        }
      }

      if (e.key.toLowerCase() === 'j' || e.key === ' ') {
        if (state.running) {
          if (state.player.cooldown <= 0) {
            shoot();
            state.player.cooldown = 0.18;
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
    });

    bestEl.textContent = Math.floor(state.best);
    createStars();
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
